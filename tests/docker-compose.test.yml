services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BOMBAVTEST_VERSION: test
        BOMBAVTEST_REVISION: test
    ports:
      - "18000:8000"
    environment:
      BOMBAVTEST_DB_PATH: /data/app.db
      BOMBAVTEST_ADMIN_USERNAME: test-admin
      BOMBAVTEST_ADMIN_PASSWORD: TestAdmin123
      BOMBAVTEST_ADMIN_DISPLAY_NAME: Test Admin
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: bombavtest-test
      S3_ACCESS_KEY_ID: test-minio
      S3_SECRET_ACCESS_KEY: test-minio-secret
      S3_REGION: us-east-1
      S3_ADDRESSING_STYLE: path
    tmpfs:
      - /data
    volumes:
      - ./bootstrap_test_db.py:/app/bootstrap_test_db.py:ro
    entrypoint:
    - /bin/sh
    - -ec
    - |
      python /app/bootstrap_test_db.py
      exec python -m uvicorn backend.main:app \
        --host 0.0.0.0 \
        --port 8000 \
        --workers 1 \
        --proxy-headers \
        --forwarded-allow-ips='*'
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: test-minio
      MINIO_ROOT_PASSWORD: test-minio-secret
    tmpfs:
      - /data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 test-minio test-minio-secret >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing local/bombavtest-test;
      '
