services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      BOMBAVTEST_DB_PATH: /data/app.db
      BOMBAVTEST_ADMIN_USERNAME: admin
      BOMBAVTEST_ADMIN_PASSWORD: admin
      BOMBAVTEST_ADMIN_DISPLAY_NAME: Admin
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: bombavtest
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_ADDRESSING_STYLE: path
    volumes:
      - ./data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing local/bombavtest;
      '

volumes:
  minio-data:
