name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate SemVer tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: ${GITHUB_REF_NAME}. Expected vX.Y.Z."
            exit 1
          fi

      - name: Resolve release commit
        id: release
        shell: bash
        run: |
          release_sha="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"

          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"
          echo "Release commit: ${release_sha}"

      - name: Verify release is current main
        shell: bash
        run: |
          git fetch origin main

          main_sha="$(git rev-parse origin/main)"
          release_sha="${{ steps.release.outputs.sha }}"

          if [[ "${release_sha}" != "${main_sha}" ]]; then
            echo "The release tag must point to the current HEAD of main."
            echo "Release: ${release_sha}"
            echo "Main:    ${main_sha}"
            exit 1
          fi

          echo "Release points to current main."

  verify-ci:
    name: Verify PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate

    steps:
      - name: Find pull request for release
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        shell: bash
        run: |
          pr_number="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls" \
              --jq ".[] |
                select(
                  .merged_at != null and
                  .base.ref == \"main\" and
                  .merge_commit_sha == \"${RELEASE_SHA}\"
                ) |
                .number" \
              | head -n 1
          )"

          if [[ -z "${pr_number}" ]]; then
            echo "No merged pull request into main was found for ${RELEASE_SHA}."
            echo "Releases must come from a pull request merged into main."
            exit 1
          fi

          echo "number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "Release commit came from PR #${pr_number}"

      - name: Verify required PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          echo "Verifying required checks for PR #${PR_NUMBER}..."

          gh pr checks "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --required

          echo "All required PR checks passed."

  deploy:
    name: Deploy Railway
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - validate
      - verify-ci

    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Install Railway CLI
        shell: bash
        run: |
          bash <(curl -fsSL railway.com/install.sh) -y
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"
          "$HOME/.railway/bin/railway" --version

      - name: Inject release metadata
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          dockerfile = Path("Dockerfile")
          text = dockerfile.read_text()

          version_marker = "ARG BOMBAVTEST_VERSION=dev"
          revision_marker = "ARG BOMBAVTEST_REVISION=unknown"

          if text.count(version_marker) != 1 or text.count(revision_marker) != 1:
              raise SystemExit(
                  "Dockerfile release metadata placeholders are missing or duplicated."
              )

          text = text.replace(
              version_marker,
              f"ARG BOMBAVTEST_VERSION={os.environ['GITHUB_REF_NAME']}",
          )

          text = text.replace(
              revision_marker,
              f"ARG BOMBAVTEST_REVISION={os.environ['RELEASE_SHA']}",
          )

          dockerfile.write_text(text)
          PY

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
        shell: bash
        run: |
          railway up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT"

  verify-production:
    name: Verify production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - validate
      - deploy

    steps:
      - name: Verify production health
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        shell: bash
        run: |
          if [[ -z "${PRODUCTION_URL}" ]]; then
            echo "PRODUCTION_URL is not configured."
            exit 1
          fi

          health_url="${PRODUCTION_URL%/}/health"

          echo "Checking ${health_url}"

          for attempt in {1..12}; do
            response="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 5 \
                --max-time 10 \
                "${health_url}" 2>/dev/null || true
            )"

            if HEALTH_RESPONSE="${response}" python - <<'PY'
          import json
          import os
          import sys

          try:
              data = json.loads(os.environ["HEALTH_RESPONSE"])
          except (json.JSONDecodeError, KeyError):
              sys.exit(1)

          expected_version = os.environ["GITHUB_REF_NAME"]
          expected_revision = os.environ["RELEASE_SHA"]

          valid = (
              data.get("ok") is True
              and data.get("status") == "healthy"
              and data.get("version") == expected_version
              and data.get("revision") == expected_revision
          )

          if not valid:
              sys.exit(1)
          PY
            then
              echo "Production is healthy."
              echo "Version: ${GITHUB_REF_NAME}"
              echo "Revision: ${RELEASE_SHA}"
              exit 0
            fi

            echo "Production is not serving the expected release yet (${attempt}/12)."
            sleep 5
          done

          echo "Production health verification failed."
          echo "Expected version: ${GITHUB_REF_NAME}"
          echo "Expected revision: ${RELEASE_SHA}"
          echo "Last response: ${response}"
          exit 1