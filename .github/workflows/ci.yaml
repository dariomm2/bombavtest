name: CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

  unit-property:
    name: Unit + Property
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit and property tests
        run: python -m pytest tests/unit tests/property -q

  integration:
    name: Integration + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run integration tests with branch coverage
        run: >-
          python -m pytest tests/unit tests/integration -q
          --cov=backend
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=75

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BOMBAVTEST_ADMIN_USERNAME: ci-admin
      BOMBAVTEST_ADMIN_PASSWORD: Migration123
      BOMBAVTEST_ADMIN_DISPLAY_NAME: CI Admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations twice
        run: |
          yoyo apply --batch --no-config-file --database sqlite:////tmp/bombavtest-ci.db migrations
          yoyo apply --batch --no-config-file --database sqlite:////tmp/bombavtest-ci.db migrations

      - name: Validate migrated database
        run: |
          python - <<'PY'
          import sqlite3

          db = sqlite3.connect("/tmp/bombavtest-ci.db")
          assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          assert db.execute("PRAGMA foreign_key_check").fetchall() == []
          assert db.execute("SELECT COUNT(*) FROM topics").fetchone()[0] == 38
          assert db.execute("SELECT username FROM users WHERE role = 'admin'").fetchone()[0] == "ci-admin"
          print("Database migrations OK")
          PY

  system:
    name: Docker + System + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - ruff
      - unit-property
      - integration
      - migrations

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run system and browser tests
        run: python -m pytest -v tests/system tests/e2e
