name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BOMBAVTEST_ADMIN_USERNAME: ci-admin
      BOMBAVTEST_ADMIN_PASSWORD: ci-admin-password
      BOMBAVTEST_ADMIN_DISPLAY_NAME: CI Admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply migrations
        run: |
          yoyo apply \
            --batch \
            --no-config-file \
            --database sqlite:////tmp/bombavtest-ci.db \
            migrations

      - name: Validate database
        run: |
          python - <<'PY'
          import sqlite3

          db = sqlite3.connect("/tmp/bombavtest-ci.db")

          integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
          assert integrity == "ok", integrity

          foreign_key_errors = db.execute(
              "PRAGMA foreign_key_check"
          ).fetchall()

          assert foreign_key_errors == [], foreign_key_errors

          print("Database OK")
          PY

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - ruff
      - migrations
      - pytest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --build-arg BOMBAVTEST_VERSION=ci \
            --build-arg BOMBAVTEST_REVISION=${{ github.sha }} \
            -t bombavtest:ci \
            .

      - name: Start container
        run: |
          docker run -d \
            --name bombavtest-ci \
            -p 8000:8000 \
            -e BOMBAVTEST_ADMIN_USERNAME=ci-admin \
            -e BOMBAVTEST_ADMIN_PASSWORD=ci-admin-password \
            -e BOMBAVTEST_ADMIN_DISPLAY_NAME="CI Admin" \
            -e S3_ENDPOINT_URL=http://localhost:9000 \
            -e S3_BUCKET=bombavtest \
            -e S3_ACCESS_KEY_ID=ci \
            -e S3_SECRET_ACCESS_KEY=ci-secret \
            -e S3_REGION=us-east-1 \
            -e S3_ADDRESSING_STYLE=path \
            bombavtest:ci

      - name: Smoke test
        run: |
          curl \
            --fail \
            --retry 30 \
            --retry-delay 1 \
            --retry-all-errors \
            http://localhost:8000/health

      - name: Show container logs on failure
        if: failure()
        run: docker logs bombavtest-ci

      - name: Remove container
        if: always()
        run: docker rm -f bombavtest-ci