[dependency-groups]
runtime = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "yoyo-migrations==9.0.0",
    "boto3==1.43.89",
    "python-multipart==0.0.32",
    "argon2-cffi==25.1.0",
]

dev = [
    { include-group = "runtime" },
    "httpx2==2.12.0",
    "hypothesis==6.165.10",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-playwright==0.9.0",
    "pytest-randomly==4.1.0",
    "ruff==0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
